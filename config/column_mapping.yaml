# Column Mapping Configuration
# This file defines the pixel regions for each data column in the screenshot.
# Coordinates are specified as percentages of image dimensions for resolution independence.

# ====================
# REFERENCE RESOLUTION
# ====================
# The resolution used when manually determining column positions
# All percentage calculations are based on this
reference_resolution:
  width: 1920
  height: 1080

# ====================
# ROW DETECTION SETTINGS
# ====================
rows:
  detection_method: "hough_lines"  # Options: hough_lines, contours, fixed_positions
  
  # Expected number of player rows (BLUE TEAM ONLY - red team ignored)
  expected_count: 5
  
  # Only process blue team (left side)
  team_filter: "blue_only"  # Only extract blue/left team stats
  blue_team_rows: [0, 1, 2, 3, 4]  # Indices (0-based)
  
  # Row detection parameters
  min_row_height_px: 60
  max_row_height_px: 120
  row_spacing_tolerance_px: 10
  
  # Y-axis region where player rows are expected (percentage of height)
  # Only blue team (left side) - approximately upper half
  # CONTROLS:
  # - y_start_pct: LOWER = rows start higher up, HIGHER = rows start lower down
  # - y_end_pct: LOWER = rows end sooner (smaller), HIGHER = rows extend lower (taller)
  # - Increase the GAP between y_start and y_end to make rows TALLER
  # VALUES MUST BE BETWEEN 0.0 and 1.0 (e.g., 0.15 = 15%, 0.65 = 65%)
  row_region:
    y_start_pct: 0.237  # Start of first blue player row (try 0.10-0.20)
    y_end_pct: 0.883    # End of 5th blue player row (try 0.60-0.70)

# ====================
# COLUMN DEFINITIONS
# ====================
# Each column defined by:
#   - x_start_pct: Left edge as % of image width
#   - x_end_pct: Right edge as % of image width
#   - y_offset_pct: Vertical offset from row top (% of row height)
#   - height_pct: Height of region (% of row height)

