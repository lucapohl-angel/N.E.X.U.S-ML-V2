# ====================
# MATCH METADATA REGIONS
# ====================
# These regions are NOT row-based, they're absolute positions on the screen
# Used for match-level data (duration, result, etc.)

metadata_regions:
  game_duration:
    x_start_pct: 0.805
    x_end_pct: 0.84
    y_start_pct: 0.15
    y_end_pct: 0.187
    description: "Game duration timer (MM:SS) - top right above enemy rows"
    preprocessing: "binarize"
  
  game_result:
    x_start_pct: 0.42
    x_end_pct: 0.59
    y_start_pct: 0.02
    y_end_pct: 0.10
    description: "Victory/Defeat text - top center of screen"
    preprocessing: "binarize"

# ====================
# PREPROCESSING OPTIONS
# ====================
preprocessing_settings:
  binarize:
    method: "adaptive_threshold"  # or "otsu"
    block_size: 11
    c_constant: 2
    invert: false
  
  enhance:
    clahe: true
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  
  denoise:
    method: "bilateral"  # or "gaussian", "median"
    d: 5
    sigma_color: 75
    sigma_space: 75
  
  resize_before_ocr:
    enabled: true
    scale_factor: 2.0  # Enlarge small text
    interpolation: "INTER_CUBIC"

# ====================
# CALIBRATION NOTES
# ====================
# To recalibrate column positions:
# 1. Run: python tools/phase1_debug_mapping.py <screenshot.png>
# 2. Visually inspect the output image with drawn rectangles
# 3. Adjust percentage values in this file
# 4. Re-run step 1 until all columns align correctly
# 5. Commit the updated config to version control

# Common issues and fixes:
# - Text cut off on left: Decrease x_start_pct
# - Text cut off on right: Increase x_end_pct
# - Text vertically clipped: Adjust y_offset_pct and height_pct
# - Wrong column extracted: Check column_key in field_extraction.yaml matches key here
