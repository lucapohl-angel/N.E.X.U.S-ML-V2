# Add more heroes as needed...
# To add a new hero:
# 1. Get a clean screenshot of the hero portrait
# 2. Crop to just the portrait (should be consistent size)
# 3. Save to heroes/portraits/ with descriptive filename
# 4. Add entry to this list with unique ID
# 5. Run: python tools/seed_database.py to update DB

# Hero roles (for filtering/stats)
roles:
  - Tank
  - Fighter
  - Assassin
  - Mage
  - Marksman
  - Support

# Hero matching settings
matching:
  method: "orb"  # Options: orb, sift, template
  confidence_threshold: 0.7  # Minimum confidence to accept match
  
  # ORB settings
  orb:
    n_features: 500
    scale_factor: 1.2
    n_levels: 8
    edge_threshold: 31
    first_level: 0
    wta_k: 2
    score_type: "HARRIS"
    patch_size: 31
    fast_threshold: 20
    
    # Matching
    matcher: "BFMatcher"
    norm_type: "HAMMING"
    cross_check: true
    good_match_ratio: 0.75  # Lowe's ratio test
  
  # Template matching settings (simpler but less robust)
  template:
    method: "TM_CCOEFF_NORMED"
    threshold: 0.8
