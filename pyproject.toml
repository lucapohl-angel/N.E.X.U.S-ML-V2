[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nexus-ml-v2"
version = "2.0.0a0"
description = "Phase 0 benchmark and compatibility foundation for N.E.X.U.S-ML V2"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "N.E.X.U.S-ML contributors" }]
dependencies = [
  "beautifulsoup4==4.13.4",
  "fastapi==0.116.1",
  "httpx>=0.27,<1",
  "numpy==2.2.6",
  "opencv-python==4.12.0.88",
  "pillow==11.3.0",
  "pydantic==2.11.7",
  "pytesseract==0.3.13",
  "python-multipart==0.0.20",
  "pyyaml==6.0.2",
  "rapidocr-onnxruntime==1.4.4",
  "requests==2.32.4",
  "uvicorn==0.35.0",
]

[project.scripts]
nexus = "nexus_v2.cli:main"
nexus-api = "nexus_v2.api.cli:main"
nexus-review = "nexus_v2.review.launcher:main"

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
  "types-pyyaml==6.0.12.20250516",
  "types-requests==2.32.4.20250611",
]

[tool.hatch.build.targets.wheel]
packages = ["nexus_v2"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: subprocess or cross-module integration coverage",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["app", "main.py", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["nexus_v2", "tests"]
exclude = ["app", "main.py", "tools"]
warn_unreachable = true

